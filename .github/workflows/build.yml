name: Build DLLs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup compiler MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile dxgi.dll
        run: cl /LD /O2 /EHsc dxgi.cpp /link /OUT:dxgi.dll

      - name: Compile ETS2_UniversalTweaker.dll
        run: cl /LD /O2 /EHsc ETS2_UniversalTweaker.cpp /link /OUT:ETS2_UniversalTweaker.dll winmm.lib

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: ETS2-Mod-DLLs
          path: |
            dxgi.dll
            ETS2_UniversalTweaker.dll
